<script>
'use strict';
const $=id=>document.getElementById(id);
// Paste your public Google OAuth Web application client ID here.
const GOOGLE_CLIENT_ID = window.TRADING_CONFIG?.googleClientId?.trim() || '';
const FOLDER_ID = '1Rvkweq4G6JKMfoupF6LWnzqzt-mMlrnQ';
let token='', expiresAt=0;
function authorize(){
 if(token && Date.now()<expiresAt)return Promise.resolve();
 if(!GOOGLE_CLIENT_ID.endsWith('.apps.googleusercontent.com'))throw Error('Set your public web client ID in config.js first.');
 if(location.protocol==='file:')throw Error('Open the hosted dashboard to authorize Google Drive.');
 if(!window.google?.accounts?.oauth2)throw Error('Google sign-in did not load. Reload and try again.');
 return new Promise((resolve,reject)=>{
  google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,
   scope:'https://www.googleapis.com/auth/drive.readonly',
   callback:r=>{if(!r.access_token){reject(Error('Google Drive authorization was declined.'));return;}
    token=r.access_token;expiresAt=Date.now()+1000*(Number(r.expires_in)-60);resolve();},
   error_callback:()=>reject(Error('Google sign-in closed or was blocked. Try Download CSV again.'))
  }).requestAccessToken({prompt:''});
 });
}
async function drive(path,params,headers={}){
 const url='https://www.googleapis.com/drive/v3/files'+path+'?'+new URLSearchParams(params);
 const res=await fetch(url,{headers:{Authorization:'Bearer '+token,...headers},cache:'no-store'});
 if(res.status===401){token='';throw Error('Session expired. Click Download CSV again.');}
 if(!res.ok){const body=await res.json().catch(()=>({}));throw Error(body.error?.message||'Drive request failed ('+res.status+').');}
 return res;
}
async function archiveInfo(name){
 const params={q:"'"+FOLDER_ID+"' in parents and trashed=false and name='"+name+"'",
 fields:'nextPageToken,files(id,size)',includeItemsFromAllDrives:true,supportsAllDrives:true};
 const files=[];do{const page=await(await drive('',params)).json();files.push(...(page.files||[]));params.pageToken=page.nextPageToken;}while(params.pageToken);
 if(files.length!==1)throw Error(files.length?'Duplicate archive names in Drive.':'Archive missing. Check your Google account and the Kaggle upload.');
 return {id:files[0].id,size:Number(files[0].size)};
}
const fmt=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'});
const money=n=>n==null||!Number.isFinite(Number(n))?'—':fmt.format(n);
const tint=n=>n>0?'gain':n<0?'loss':'';
let snapshot={}, mode='hold', hasRead=false, selected='RELIANCE';
try{const prior=localStorage.getItem('nifty.chartSymbol');if(['RELIANCE','HDFCBANK','ICICIBANK','INFY','TCS',''].includes(prior))selected=prior;}catch{}
const observedPrices=new Map(),quoteKeys=new Map();
let authMessage='';
function cells(parent,values,tag){const tr=document.createElement('tr');values.forEach(v=>{const c=document.createElement(tag);c.textContent=v;tr.append(c)});parent.append(tr);return tr;}
function render(){
 const d=snapshot, p=Object.values(d.positions||{}), sum=p.reduce((a,v)=>a+Number(v.unrealized_pnl||0),0);
 for(const [id,n] of [['equity',d.balance],['cash',d.cash],['invested',d.cash!=null&&d.balance!=null?d.balance-d.cash:null],['realized',d.realized_pnl],['openpnl',d.balance!=null?sum:null]]){
 $(id).textContent=money(n);if(['realized','openpnl'].includes(id))$(id).className=tint(n);}
 $('overall').textContent='Overall P&L · '+money(d.pnl);$('overall').className=tint(d.pnl);
 $('hold').textContent='Positions'+(hasRead?' ('+p.length+')':'');
 for(const k of ['hold','trades','sig'])$(k).setAttribute('aria-pressed',String(k===mode));
 const holdings=mode==='hold';$('rows').replaceChildren();$('head').replaceChildren();
 const q=d.signals?.[selected];
 $('symbol').textContent=selected||'Portfolio value';
 $('chartprice').textContent=money(selected?q?.price:d.balance);
 $('markettime').textContent=q?.time?'Signal quote · '+q.time+' IST':'';
 for(const b of $('watch').children){const sym=b.dataset.symbol;b.lastChild.textContent=money(sym?d.signals?.[sym]?.price:d.balance);b.setAttribute('aria-pressed',String(sym===selected));}
 $('connect').hidden=authorized();
 if(mode==='trades'){fillTrades();return;}
 const h=holdings?['Symbol','Qty','Entry','Open P&L']:['Symbol','Last price','Action','Model score','Time (IST)'];cells($('head'),h,'th');
 if(holdings){for(const v of p){const tr=cells($('rows'),[v.symbol,v.qty,money(v.entry_price),money(v.unrealized_pnl)],'td');tr.lastChild.className=tint(v.unrealized_pnl);}}
 else{for(const [sym,v] of Object.entries(d.signals||{}).sort(([a],[b])=>a.localeCompare(b)))cells($('rows'),[sym,money(v.price),v.action,Number(v.confidence).toFixed(1)+'%',v.time],'td');}
 if(!$('rows').children.length){const tr=cells($('rows'),[hasRead?(holdings?'No open positions.':'No signals recorded.'):'Waiting for portfolio…'],'td');tr.firstChild.colSpan=h.length;}
}
for(const k of ['hold','trades','sig'])$(k).onclick=()=>{mode=k;render();autoLoad()};
async function poll(){try{const r=await fetch('https://niftybot-73b5f-default-rtdb.firebaseio.com/live_data.json',{cache:'no-store',signal:AbortSignal.timeout(8000)});if(!r.ok)throw Error('HTTP '+r.status);
 snapshot=await r.json()||{};hasRead=true;sample(snapshot);render();draw();autoLoad();$('stamp').textContent='Snapshot read at '+new Date().toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata'})+' IST · Simulated account';}catch(e){$('stamp').textContent='Portfolio unavailable · '+e.message;}finally{setTimeout(poll,5000)}}
function istDay(){return new Date(Date.now()+19800000).toISOString().slice(0,10);}
// The equity trace uses observed account snapshots or dated statement events.
// Stock candles come exclusively from the recorded OHLC archive.
const clock=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',hour12:false});
const dateLabel=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short'});
const samples=[], historyByStock=new Map();
let savedEquity=[], trace=[], cursor=-1, latestSnapshot='';
function sample(d){
 const key=JSON.stringify([d.balance,d.signals,d.positions]);
 if(d.balance!=null && Number.isFinite(Number(d.balance)) && key!==latestSnapshot){
  latestSnapshot=key;samples.push({t:Date.now(),v:Number(d.balance)});if(samples.length>1500)samples.shift();
 }
 for(const [sym,q] of Object.entries(d.signals||{})){
  const key=q.time+' '+q.price;
  if(quoteKeys.get(sym)===key||q.price==null||!Number.isFinite(Number(q.price)))continue;
  quoteKeys.set(sym,key);
  if(!observedPrices.has(sym))observedPrices.set(sym,[]);
  const arr=observedPrices.get(sym);arr.push({t:Date.now(),v:Number(q.price)});if(arr.length>500)arr.shift();
 }
}
function candles(rows,minutes){
 const buckets=new Map(),width=minutes*60000;
 for(const row of rows){const t=Math.floor(row.t/width)*width,prev=buckets.get(t);
  if(!prev)buckets.set(t,{...row,t});
  else{prev.h=Math.max(prev.h,row.h);prev.l=Math.min(prev.l,row.l);prev.c=row.c;}}
 return Array.from(buckets.values()).slice(-80);
}
function csvFields(line){
 const out=[];let s='',quoted=false;
 for(let i=0;i<line.length;i++){const ch=line[i];
 if(ch==='"'){if(quoted&&line[i+1]==='"'){s+='"';i++;}else quoted=!quoted;}
 else if(ch===','&&!quoted){out.push(s);s='';}else s+=ch;}
 out.push(s);return out;
}
async function archiveTail(name){
 const {id,size}=await archiveInfo(name);if(!size)return [];
 const start=Math.max(0,size-2*1024*1024),params={alt:'media',supportsAllDrives:true};
 const r=await drive('/'+encodeURIComponent(id),params,{Range:'bytes='+start+'-'+(size-1)});
 if(start&&r.status!==206)throw Error('Drive did not return the requested range.');
 const lines=(await r.text()).split(/\r?\n/);lines.shift();return lines.filter(Boolean);
}
let statementEvents=[];
const archiveCache={candles:{updated:0,busy:false,error:''},statement:{updated:0,busy:false,error:''}};
function authorized(){return !!token&&Date.now()<expiresAt;}
async function refreshArchive(kind){
 const cache=archiveCache[kind];
 if(!authorized()||cache.busy||Date.now()-cache.updated<60000)return;
 cache.busy=true;cache.error='';
 try{
  const lines=await archiveTail(kind+'_all.csv');
  if(kind==='candles'){
   const grouped=new Map();
   for(const line of lines){
    const [date,sym,...rest]=line.split(','),t=Date.parse(date),[o,h,l,c]=rest.map(Number);
    if(!sym||![t,o,h,l,c].every(Number.isFinite))continue;
    if(!grouped.has(sym))grouped.set(sym,[]);
    grouped.get(sym).push({t,o,h,l,c});
   }
   historyByStock.clear();
   for(const [sym,rows] of grouped)historyByStock.set(sym,rows.sort((a,b)=>a.t-b.t));
  }else{
   const equity=new Map(), events=[];
   for(const line of lines){
    const r=csvFields(line),t=Date.parse(r[0]);
    if(!Number.isFinite(t))continue;
    if(r[12]?.trim()&&Number.isFinite(Number(r[12])))equity.set(t,{t,v:Number(r[12])});
    if(r[1]==='BUY'||r[1]==='SELL')events.push(r);
   }
   statementEvents=events.sort((a,b)=>Date.parse(b[0])-Date.parse(a[0])).slice(0,100);
   savedEquity=Array.from(equity.values()).sort((a,b)=>a.t-b.t);
  }
 }catch(e){cache.error=e.message||String(e);}
 finally{cache.busy=false;cache.updated=Date.now();render();draw();}
}
function autoLoad(){
 refreshArchive(selected?'candles':'statement');
 if(mode==='trades')refreshArchive('statement');
}
function setupWatch(){
 const symbols=['RELIANCE','HDFCBANK','ICICIBANK','INFY','TCS',''];
 for(const sym of symbols){const b=document.createElement('button');b.className='watchitem';b.dataset.symbol=sym;
 const title=document.createElement('strong');title.textContent=sym||'Portfolio';
 b.append(title,document.createElement('span'));b.onclick=()=>{selected=sym;cursor=-1;
 try{localStorage.setItem('nifty.chartSymbol',sym);}catch{}
 render();draw();autoLoad();};$('watch').append(b);}
}
function fillTrades(){
 const headers=['Time (IST)','Stock','Side','Qty','Price','Gross P&L','Charges','Net P&L'];
 cells($('head'),headers,'th');
 for(const r of statementEvents){
 const cash=v=>v&&v.trim()?money(v):'—';const t=Date.parse(r[0]);
 const row=cells($('rows'),[dateLabel.format(t)+' '+clock.format(t),r[2],r[1],r[3],cash(r[4]),cash(r[9]),cash(r[18]),cash(r[19])],'td');
 row.lastChild.className=tint(r[19]);}
 if(!statementEvents.length){
 const cache=archiveCache.statement;
 const note=cache.error||(!authorized()?'Connect Google to see archived trades.':cache.busy?'Reading trade history…':'No buys or sells in the recent statement.');
 cells($('rows'),[note],'td').firstChild.colSpan=headers.length;}
}
function draw(){
 const minutes=Number($('interval').value), bars=selected?candles(historyByStock.get(selected)||[],minutes):[];
 const stock=bars.length>0, cache=archiveCache[selected?'candles':'statement'];
 $('interval').hidden=!selected;
 const lastEvent=savedEquity.at(-1)?.t??0;
 trace=selected?(stock?bars:observedPrices.get(selected)||[]):[...savedEquity,...samples.filter(r=>r.t>lastEvent)].slice(-200);
 const canvas=$('plot'),w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;
 const ratio=window.devicePixelRatio||1;canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio);
 const g=canvas.getContext('2d');g.scale(ratio,ratio);
 const left=8,right=w-76,top=12,bottom=h-24;
 const description=stock?'Recorded candles · '+minutes+' min':selected?'Observed quote prices':'Portfolio equity';
 const timestamp=snapshot.signals?.[selected]?.time;
 $('chartcaption').textContent=authMessage||cache.error||(description+(timestamp?' · Signal quote '+timestamp+' IST':'')+(cache.busy?' · Syncing archive…':''));
 if(!trace.length){$('readout').textContent='—';g.fillStyle='#b1bfcd';g.font='14px system-ui';g.fillText('Waiting for recorded data…',left+6,h/2);return;}
 let lo=Infinity,hi=-Infinity;
 for(const r of trace){lo=Math.min(lo,stock?r.l:r.v);hi=Math.max(hi,stock?r.h:r.v);}
 const pad=Math.max((hi-lo)*.12,.05);lo-=pad;hi+=pad;
 const x=i=>left+(i+.5)*(right-left)/trace.length,y=v=>bottom-(v-lo)*(bottom-top)/(hi-lo);
 g.font='11px system-ui';g.lineWidth=1;
 for(let i=0;i<5;i++){const v=lo+(hi-lo)*i/4,py=y(v);g.strokeStyle='#334253';g.beginPath();g.moveTo(left,py);g.lineTo(right,py);g.stroke();g.fillStyle='#b2c1cf';g.fillText(v.toLocaleString('en-IN',{maximumFractionDigits:2}),right+6,py+4);}
 if(stock){const body=Math.max(1,Math.min(11,(right-left)/trace.length*.65));trace.forEach((r,i)=>{g.fillStyle=g.strokeStyle=r.c>=r.o?'#6ed2ab':'#f3918f';g.beginPath();g.moveTo(x(i),y(r.h));g.lineTo(x(i),y(r.l));g.stroke();g.fillRect(x(i)-body/2,Math.min(y(r.o),y(r.c)),body,Math.max(1,Math.abs(y(r.o)-y(r.c))));});}
 else{g.strokeStyle='#78dfbd';g.lineWidth=2;g.beginPath();trace.forEach((r,i)=>i?g.lineTo(x(i),y(r.v)):g.moveTo(x(i),y(r.v)));g.stroke();const i=trace.length-1;g.fillStyle=g.strokeStyle;g.beginPath();g.arc(x(i),y(trace[i].v),3,0,Math.PI*2);g.fill();}
 const i=cursor<0?trace.length-1:Math.min(cursor,trace.length-1),r=trace[i];
 if(cursor>=0){g.strokeStyle='#abbac9';g.lineWidth=1;g.setLineDash([3,4]);g.beginPath();g.moveTo(x(i),top);g.lineTo(x(i),bottom);g.stroke();g.setLineDash([]);}
 g.fillStyle='#b2c1cf';g.fillText(clock.format(trace[0].t),left,h-6);if(trace.length>1)g.fillText(clock.format(trace.at(-1).t),right-33,h-6);
 $('readout').textContent=dateLabel.format(r.t)+' '+clock.format(r.t)+' IST  ·  '+(stock?'O '+money(r.o)+'   H '+money(r.h)+'   L '+money(r.l)+'   C '+money(r.c):money(r.v));
 canvas.setAttribute('aria-label',($('chartcaption').textContent)+' · '+$('readout').textContent);
}
$('plot').onpointermove=e=>{cursor=Math.max(0,Math.min(trace.length-1,Math.floor((e.offsetX-8)/Math.max(1,$('plot').clientWidth-84)*trace.length)));draw();};
$('plot').onpointerleave=()=>{cursor=-1;draw();};
$('plot').onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();cursor=Math.max(0,Math.min(trace.length-1,(cursor<0?trace.length-1:cursor)+(e.key==='ArrowLeft'?-1:1)));draw();}};
$('interval').onchange=()=>{cursor=-1;draw();};
$('connect').onclick=async()=>{
 try{authMessage='';await authorize();archiveCache.candles.updated=0;archiveCache.statement.updated=0;autoLoad();}
 catch(e){authMessage=e.message||String(e);}render();draw();
};
new ResizeObserver(draw).observe($('plot'));
setInterval(()=>{if(!document.hidden){autoLoad();render();}},30000);

function bounds(period,from,to){if(period==='all')return null;const d=istDay();
 if(period==='today')return [d+'T00:00:00',d+'T23:59:59'];
 if(!from||!to)throw Error('Enter both dates and times.');const normal=v=>v.length===16?v+':00':v;
 const pair=[normal(from),normal(to)];if(pair[0]>pair[1])throw Error('End time must be after the start.');return pair;}
let objectURL='',run=0;
function clearReady(){if(objectURL)URL.revokeObjectURL(objectURL);objectURL='';$('ready').hidden=true;$('msg').textContent='';}
$('open').onclick=()=>{$('dlg').showModal();};
$('close').onclick=()=>$('dlg').close();
$('dlg').onclose=()=>{run++;lock(false);clearReady();};
function lock(b){for(const id of ['save','kind','period','from','to'])$(id).disabled=b;}
for(const id of ['kind','period','from','to'])$(id).onchange=()=>{clearReady();$('range').hidden=$('period').value!=='custom';};
function output(url,name){const a=$('ready');a.href=url;a.download=name;a.hidden=false;a.click();$('msg').textContent='If the download did not start, choose Save CSV.';}
const statementLabels=['Date and time (IST)','Activity','Stock','Shares','Entry price (INR)','Exit or mark (INR)','Gross trade P&L (INR)','Estimated charges (INR)','Net trade P&L (INR)','Open P&L (INR)','Cumulative realized P&L (INR)','Cash (INR)','Portfolio value (INR)'];
function statementRow(header, line){
 const cells=csvFields(line), row=Object.fromEntries(header.map((name,i)=>[name,cells[i]??'']));
 const amount=v=>v==null||v.trim()===''||!Number.isFinite(Number(v))?'':Number(v).toFixed(2);
 const session=['START','END'].includes(row.event),sell=row.event==='SELL';
 const labels={START:'Session opened',END:'Session ended',POSITION:'Holding snapshot',BUY:'Bought',SELL:'Sold'};
 return [row.time_ist.slice(0,19).replace('T',' '),labels[row.event]||row.event,row.symbol,row.qty,
 amount(row.entry_price),row.event==='BUY'?'':amount(row.price),sell?amount(row.gross_trade_pnl):'',
 sell?amount(row.estimated_total_charges):'',sell?amount(row.net_trade_pnl):'',amount(row.unrealized_pnl),
 session||sell?amount(row.realized_pnl):'',row.event==='POSITION'?'':amount(row.cash),
 row.event==='POSITION'?'':amount(row.equity)].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',');
}
async function exportCsv(){clearReady();const seq=++run;lock(true);
 try{const kind=$('kind').value,pretty=kind==='statement',base=(kind==='raw'?'statement':kind)+'_all.csv',span=bounds($('period').value,$('from').value,$('to').value);
 await authorize();autoLoad();render();if(seq!==run)return;
 const info=await archiveInfo(base);if(seq!==run)return;if(!info.size)throw Error('Archive is empty.');
 const mediaPath='/'+encodeURIComponent(info.id), params={alt:'media',supportsAllDrives:true};
 if(!span&&!pretty){const blob=await(await drive(mediaPath,params)).blob();if(seq!==run)return;
 objectURL=URL.createObjectURL(blob);output(objectURL,base);return;}
 let offset=0, tail='',header='',count=0;const chunks=[],decoder=new TextDecoder();
 function consume(line){line=line.replace(/\r$/,'');if(!line)return;if(!header){header=csvFields(line.replace(/^\uFEFF/,''));chunks.push((pretty?'\uFEFF'+statementLabels.join(','):line)+'\r\n');return;}
 const sec=line.slice(0,19);if(!span||(sec>=span[0]&&sec<=span[1])){chunks.push((pretty?statementRow(header,line):line)+'\r\n');count++;}}
 while(offset<info.size){let bytes;
 const end=Math.min(offset+4194304,info.size)-1;
 const response=await drive(mediaPath,params,{Range:'bytes='+offset+'-'+end});
 if(response.status!==206 && !(offset===0 && end===info.size-1))throw Error('Drive could not read the requested range.');
 bytes=new Uint8Array(await response.arrayBuffer());
 if(bytes.length!==end-offset+1)throw Error('Archive changed during download. Try again.');
 offset=end+1;
 if(seq!==run)return;
 const lines=(tail+decoder.decode(bytes,{stream:true})).split('\n');tail=lines.pop();lines.forEach(consume);$('msg').textContent='Reading archive · '+Math.round(offset/info.size*100)+'%';}
 consume(tail+decoder.decode());if(!count)throw Error('No records in this time range.');
 objectURL=URL.createObjectURL(new Blob(chunks,{type:'text/csv;charset=utf-8'}));output(objectURL,kind+'_'+(span?span.join('_').replace(/:/g,'-'):'history')+'.csv');
 }catch(e){if(seq===run)$('msg').textContent=e.message||String(e);}finally{if(seq===run)lock(false);}}
$('save').onclick=exportCsv;setupWatch();render();draw();poll();
</script></body></html>
